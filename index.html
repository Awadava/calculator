<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор арбитражных ставок с кэшбэком</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #333;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input {
            padding: 5px;
            width: 200px;
        }
        button {
            margin-top: 15px;
            padding: 8px 16px;
            font-size: 16px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff;
            border: 1px solid #ccc;
            width: 320px;
        }
    </style>
</head>
<body>
    <h1>Калькулятор арбитражных ставок с кэшбэком</h1>
    <p>Введите общую сумму для ставок и коэффициенты для двух исходов:</p>
    
    <div>
        <label for="totalSum">Общая сумма:</label>
        <input type="number" id="totalSum" placeholder="Введите сумму" step="any">
        
        <label for="k1">Коэффициент исхода 1 (k1):</label>
        <input type="number" id="k1" placeholder="Введите k1" step="any">
        
        <label for="k2">Коэффициент исхода 2 (k2):</label>
        <input type="number" id="k2" placeholder="Введите k2" step="any">
        
        <button onclick="calculateBets()">Рассчитать</button>
    </div>
    
    <div class="result" id="result"></div>
    
    <script>
        function calculateBets() {
            // Получаем введённые значения
            var totalSum = parseFloat(document.getElementById("totalSum").value);
            var k1 = parseFloat(document.getElementById("k1").value);
            var k2 = parseFloat(document.getElementById("k2").value);
            
            // Проверка корректности ввода
            if (isNaN(totalSum)  isNaN(k1)  isNaN(k2)) {
                document.getElementById("result").innerHTML = "<p style='color:red;'>Пожалуйста, заполните все поля корректными числами.</p>";
                return;
            }
            if (k1 <= 0.1 || k2 <= 0.1) {
                document.getElementById("result").innerHTML = "<p style='color:red;'>Коэффициенты должны быть больше 0.1 для корректных расчётов.</p>";
                return;
            }
            
            // Вычисляем распределение ставок:
            // Формулы:
            // y = T * (k1 - 0.1) / (k1 + k2 - 0.2)
            // x = T * (k2 - 0.1) / (k1 + k2 - 0.2)
            var denominator = k1 + k2 - 0.2;
            var y = totalSum * (k1 - 0.1) / denominator;
            var x = totalSum * (k2 - 0.1) / denominator;
            
            // Вычисляем выплаты для обоих исходов
            // Если выигрывает исход 1: выплата = x * k1 + y * 0.1
            // Если выигрывает исход 2: выплата = y * k2 + x * 0.1
            var payout1 = x * k1 + y * 0.1;
            var payout2 = y * k2 + x * 0.1;
            
            var net_profit1 = payout1 - totalSum;
            var net_profit2 = payout2 - totalSum;
            // При оптимальном распределении чистый выигрыш должен быть равен, поэтому берём среднее
            var net_profit = (net_profit1 + net_profit2) / 2;
            
            // Форматируем результаты до двух знаков после запятой
            x = x.toFixed(2);
            y = y.toFixed(2);
            net_profit = net_profit.toFixed(2);
            
            // Выводим результаты
            var resultHTML = "<h2>Результаты:</h2>";
            resultHTML += "<p>Ставка на исход 1: " + x + "</p>";
            resultHTML += "<p>Ставка на исход 2: " + y + "</p>";
            resultHTML += "<p>Чистый выигрыш (при любом исходе): " + net_profit + "</p>";
            
            document.getElementById("result").innerHTML = resultHTML;
        }
    </script>
</body>
</html>
